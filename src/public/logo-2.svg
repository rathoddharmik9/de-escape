<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="100%" height="100%">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500&amp;family=Nunito:wght@900&amp;display=swap');
            
            .title {
                font-family: 'Nunito', sans-serif;
                font-size: 98px;
                font-weight: 900;
                fill: #1a7138;
                stroke: #1a7138;
                stroke-width: 4px; /* Simulates the ultra-heavy "Black" font weight */
                stroke-linejoin: round;
                letter-spacing: 0.5px;
            }
            
            .subtitle {
                font-family: 'Montserrat', sans-serif;
                font-size: 21px;
                font-weight: 500;
                letter-spacing: 3.5px;
                fill: #1a7138;
            }
        </style>
    </defs>

    <!-- White Background -->
    <rect width="100%" height="100%" fill="#ffffff" />

    <!-- Main Logo Text -->
    <text x="300" y="130" class="title" text-anchor="middle">De-escape</text>

    <!-- Subtitle Text -->
    <text x="300" y="195" class="subtitle" text-anchor="middle">DISCOVER WHAT'S AROUND YOU</text>
</svg>
